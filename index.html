  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;

<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 360, H = 640, GROUND = 580;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let R = 2;

function resize(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  R = Math.max(1, Math.min(4, Math.ceil(s * dpr)));
  cv.width = W * R; cv.height = H * R;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

// ---------- pixel sprites ----------
function spr(rows, pal){
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    const col = pal[rows[j][i]];
    if (col){ x.fillStyle = col; x.fillRect(i, j, 1, 1); }
  }
  return c;
}
const GPAL = { h:'#8c8680', H:'#d6d2cc', s:'#d69c7a', S:'#f4d0b4', b:'#8a786c', E:'#3b2a24',
  C:'#f28f8f', M:'#b04f48', n:'#e2ab8a' };
const headRows = [
  "......hhhhhh......",
  "....hhHHHHHHhh....",
  "...hHHHhHHHhHHh...",
  "..hHHHHHHHHHHHHh..",
  ".hHHhHHHHHHHHhHHh.",
  ".hHHHHHHHHHHHHHHh.",
  "hHHHHssssssssHHHHh",
  "hHHHsSSSSSSSSsHHHh",
  "hHHSSSSSSSSSSSSHHh",
  "hHHSbbSSSSSSbbSHHh",
  ".hHSSESSSSSSESSHh.",
  ".hSSSESSSSSSESSSh.",
  ".hSCCSSSnnSSSCCSh.",
  "..sCCSSSSSSSSCCs..",
  "..sSSMSSSSSSMSSs..",
  "...sSSMMMMMMSSs...",
  "....ssSSSSSSss....",
  "......ssssss......",
];
const happyRows = headRows.slice();
happyRows[10] = ".hHSSESSSSSSESSHh.";
happyRows[11] = ".hSSESESSSSESESSh.";
const HEAD = spr(headRows, GPAL);
const HEAD_HAPPY = spr(happyRows, GPAL);
const WPAL = { o:'#6b7d96', W:'#ffffff', w:'#c8d7ea' };
const wingRows = [
  "oo........",
  "oWo.......",
  "oWWoo.....",
  ".oWWWoo...",
  ".owWWWWoo.",
  "..owwWWWWo",
  "...ooooooo",
];
const WING_UP = spr(wingRows, WPAL);
const WING_DOWN = spr(wingRows.slice().reverse(), WPAL);

const ING = {
  milk: { name:'Молоко', acc:'молоко', done:'Молоко есть!', spr: spr([
    "...oooo...",
    "..oWWWWo..",
    ".oWWWWWWo.",
    "oooooooooo",
    "oWWWWWWWWo",
    "oBBBBBBBBo",
    "oBWWWWWWBo",
    "oBWBBBBWBo",
    "oBBBBBBBBo",
    "oWWWWWWWWo",
    "oWWWWWWWgo",
    "oooooooooo"], {o:'#3d4a66', W:'#ffffff', B:'#4f9df0', g:'#cdd6e6'}) },
  egg: { name:'Яйца', acc:'яйца', done:'Яйца есть!', spr: spr([
    "...oooo...",
    "..oEEEEo..",
    ".oEWEEEEo.",
    ".oWEEEEEo.",
    "oEEEEEEEEo",
    "oEEEEEEEEo",
    "oEEEEEEEeo",
    "oEEEEEEEeo",
    ".oEEEEEeo.",
    ".oeEEEeeo.",
    "..oeeeeo..",
    "...oooo..."], {o:'#7a5a3a', E:'#fff4dc', W:'#ffffff', e:'#e6cfa6'}) },
  flour: { name:'Мука', acc:'муку', done:'Мука есть!', spr: spr([
    ".oooooooo.",
    ".oFfFfFfo.",
    ".oFFFFFFo.",
    "oFFFFFFFFo",
    "oFFWWWWFFo",
    "oFWWYYWWFo",
    "oFWYWWYWFo",
    "oFWWYYWWFo",
    "oFFWWWWFFo",
    "oFFFFFFFfo",
    "oFFFFFFffo",
    "oooooooooo"], {o:'#6b4a2a', F:'#ecd3a4', f:'#d2b37e', W:'#ffffff', Y:'#e8b23a'}) },
  sugar: { name:'Сахар', acc:'сахар', done:'Сахар есть!', spr: spr([
    "...ooooo...",
    "...oWWWo...",
    "...oWWWo...",
    "...oGGGo...",
    "...ooooo...",
    "ooooo.ooooo",
    "oWWWo.oWWWo",
    "oWWWo.oWWWo",
    "oGGGo.oGGGo",
    "ooooo.ooooo"], {o:'#6a7488', W:'#ffffff', G:'#d3dae6'}) },
  berry: { name:'Клубника', acc:'клубнику', done:'Клубника есть!', spr: spr([
    "....GG....",
    "..GGGGGG..",
    ".oGGRRGGo.",
    "oRRRRRRRRo",
    "oRYRRRYRRo",
    "oRRRRRRRRo",
    "oRRYRRRYRo",
    ".oRRRRRRo.",
    ".oRYRRRRo.",
    "..oRRRRo..",
    "...oRRo...",
    "....oo...."], {o:'#7a1f2a', G:'#4caf50', R:'#ec3b4f', Y:'#ffe9a8'}) },
};
const HEART = spr([".RR.RR.","RWRRRRR","RRRRRRR",".RRRRR.","..RRR..","...R..."], {R:'#ff4d6d', W:'#ffd1da'});
const HEART_E = spr([".RR.RR.","RRRRRRR","RRRRRRR",".RRRRR.","..RRR..","...R..."], {R:'#9a8a96'});

const LEVELS = [
  { ing:'milk',  need:3, speed:1.6, gap:250, spacing:240 },
  { ing:'egg',   need:4, speed:1.75, gap:240, spacing:235 },
  { ing:'flour', need:4, speed:1.85, gap:230, spacing:230 },
  { ing:'sugar', need:5, speed:1.95, gap:220, spacing:225 },
  { ing:'berry', need:5, speed:2.05, gap:210, spacing:220 },
];
const MAX_HEARTS = 5;

// ---------- sound ----------
let ac = null;
function beep(f1, f2, dur, type='square', vol=0.05, delay=0){
  if (!ac) return;
  try {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch(e){}
}
const sfx = {
  flap(){ beep(420, 680, 0.09, 'triangle', 0.07); },
  coin(){ beep(880, 0, 0.08, 'square', 0.04); beep(1320, 0, 0.14, 'square', 0.04, 0.07); },
  hit(){ beep(220, 90, 0.25, 'sawtooth', 0.05); },
  win(){ [523,659,784,1047].forEach((f,i)=>beep(f,0,0.16,'square',0.04,i*0.11)); },
  poof(){ beep(300, 60, 0.4, 'triangle', 0.08); },
  ding(i){ beep(700 + i*90, 0, 0.12, 'triangle', 0.05); },
  blow(){ beep(900, 200, 0.5, 'sawtooth', 0.02); },
  fanfare(){ [523,523,587,523,698,659].forEach((f,i)=>beep(f,0,0.22,'square',0.04,i*0.2)); },
};

// ---------- helpers ----------
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const FONT = '"Press Start 2P", monospace';
function rect(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function img(s, x, y, sc){ ctx.drawImage(s, Math.round(x), Math.round(y), s.width*sc, s.height*sc); }
function imgC(s, cx, cy, sc){ img(s, cx - s.width*sc/2, cy - s.height*sc/2, sc); }
function text(str, x, y, size, color='#fff', align='center', outline='#3a2233'){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline){ ctx.lineWidth = Math.max(3, size*0.45); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrap(str, x, y, maxW, size, lh, color, outline){
  ctx.font = size + 'px ' + FONT;
  const words = str.split(' '); let line = '', lines = [];
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t;
  }
  lines.push(line);
  lines.forEach((l,i) => text(l, x, y + i*lh, size, color, 'center', outline));
  return lines.length;
}
function panel(x,y,w,h){
  rect(x+6,y+6,w,h,'rgba(40,20,30,.35)');
  rect(x,y,w,h,'#5a3b2e'); rect(x+4,y+4,w-8,h-8,'#f6c99a'); rect(x+8,y+8,w-16,h-16,'#fff7ec');
}

function drawGrandma(x, y, sc, opts={}){
  const { happy=false, wingDown=false, angle=0, alpha=1 } = opts;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(angle);
  const hw = 9*sc, hh = 9*sc;
  const wing = wingDown ? WING_DOWN : WING_UP;
  const ww = wing.width*sc, wh = wing.height*sc;
  const ay = wingDown ? -sc*1 : sc*3 - wh;
  // left wing
  ctx.drawImage(wing, -hw - ww + sc*3, ay, ww, wh);
  // right wing (mirrored)
  ctx.save(); ctx.scale(-1,1); ctx.drawImage(wing, -hw - ww + sc*3, ay, ww, wh); ctx.restore();
  ctx.drawImage(happy ? HEAD_HAPPY : HEAD, -hw, -hh, 18*sc, 18*sc);
  ctx.restore();
}

// ---------- background ----------
const clouds = Array.from({length:6}, (_,i) => ({ x: rnd(0,W), y: rnd(40, 380), s: rnd(0.6,1.3), v: rnd(0.15,0.35) }));
function drawCloud(x,y,s){
  const u = Math.round(6*s);
  rect(x+u, y, u*4, u, '#fff'); rect(x, y+u, u*6, u*2, '#fff'); rect(x+u*2, y-u, u*2, u, '#fff');
  rect(x, y+u*3, u*6, Math.max(2,u/2), '#dfeffd');
}
let groundOff = 0;
function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'#7ccaff'); g.addColorStop(1,'#d9f2ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,GROUND);
  // far hills
  for (let i = 0; i < 5; i++){
    const hx = ((i*150 - groundOff*0.3) % 750 + 750) % 750 - 160;
    const hh = (i % 2) ? 34 : 50, col = (i % 2) ? '#a8e0ad' : '#93d39a';
    for (let s = 0; s < 5; s++){ const w = 160 - s*30; rect(hx + s*15, GROUND - hh*(s+1)/5, w, hh/5 + 1, col); }
  }
  for (const c of clouds) drawCloud(c.x, c.y, c.s);
}
function drawGround(){
  rect(0, GROUND, W, 6, '#a3314a');
  const sq = 20;
  for (let r = 0; r < 4; r++) for (let i = -1; i < W/sq + 2; i++){
    const x = i*sq - (groundOff % (sq*2));
    rect(x, GROUND+6+r*sq, sq, sq, ((i + r) % 2 === 0) ? '#e8425a' : '#fff4f0');
  }
}
function updateBg(dt, speed){
  groundOff += speed*dt;
  for (const c of clouds){ c.x -= c.v*dt*(speed>0?1:0.4); if (c.x < -60){ c.x = W + rnd(10,80); c.y = rnd(40,380); } }
}

// ---------- pipes (candy columns) ----------
const PW = 52, CAPW = 64, CAPH = 18;
function drawColumn(x, top, bottom, capAtBottom){
  // body
  const h = bottom - top;
  rect(x, top, PW, h, '#fff3f8');
  for (let y = top - ((top % 24)+24)%24; y < bottom; y += 24){
    const y0 = Math.max(top, y), y1 = Math.min(bottom, y+12);
    if (y1 > y0) rect(x, y0, PW, y1-y0, '#ff9ec7');
  }
  rect(x, top, 4, h, '#d9628f'); rect(x+PW-4, top, 4, h, '#d9628f'); rect(x+8, top, 5, h, 'rgba(255,255,255,.55)');
  // cap with icing
  const cy = capAtBottom ? bottom - CAPH : top;
  const cx = x - (CAPW-PW)/2;
  rect(cx, cy, CAPW, CAPH, '#7a3a52'); rect(cx+3, cy+3, CAPW-6, CAPH-6, '#ffd6e7');
  rect(cx+6, cy+5, CAPW-12, 3, '#ffffff');
  // drips
  if (capAtBottom){ for (let i=0;i<4;i++) rect(cx+8+i*14, cy-((i%2)?6:10), 6, (i%2)?6:10, '#ffd6e7'); }
  else { for (let i=0;i<4;i++) rect(cx+8+i*14, cy+CAPH, 6, (i%2)?6:10, '#ffd6e7'); }
}

// ---------- game state ----------
let state = 'title', stateT = 0, t = 0;
let lvl = 0, collected = 0, hearts = MAX_HEARTS, got = [];
let g = { x: 100, y: 300, vy: 0, flapT: 0, inv: 0 };
let pipes = [], items = [], parts = [], floats = [], lastC = 320, shake = 0;
let kPhase = 'idle', kT = 0, candles = 0;

function resetLevel(){
  collected = 0; hearts = MAX_HEARTS; pipes = []; items = []; floats = [];
  g = { x: 100, y: 280, vy: 0, flapT: 0, inv: 0 }; lastC = 300;
}
function setState(s){ state = s; stateT = 0; }

function spawnPipe(){
  const L = LEVELS[lvl];
  const minC = L.gap/2 + 50, maxC = GROUND - L.gap/2 - 50;
  const c = clamp(lastC + rnd(-120, 120), minC, maxC); lastC = c;
  const x = W + 10;
  pipes.push({ x, top: c - L.gap/2, bot: c + L.gap/2 });
  items.push({ x: x + PW/2, y: c + rnd(-35, 35), ph: rnd(0,6) });
}

function flap(){ g.vy = -5.4; g.flapT = 10; sfx.flap(); }

function circleRect(cx, cy, r, x, y, w, h){
  const nx = clamp(cx, x, x+w), ny = clamp(cy, y, y+h);
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}
function hurt(){
  if (g.inv > 0) return;
  hearts--; g.inv = 100; shake = 10; sfx.hit();
  for (let i=0;i<10;i++) parts.push({ x:g.x, y:g.y, vx:rnd(-3,3), vy:rnd(-3,1), c:'#ffffff', s:4, life:30 });
  if (hearts <= 0) setState('fail');
}

function confetti(n, y=200){
  const cols = ['#ff4d6d','#ffd23f','#4f9df0','#4caf50','#ff9ec7','#b77cff'];
  for (let i=0;i<n;i++) parts.push({ x: rnd(20, W-20), y: y + rnd(-60,20), vx: rnd(-2,2), vy: rnd(-5,-1), c: cols[i%cols.length], s: rnd(4,7)|0, life: rnd(90,160), grav: 0.08, spin: true });
}

// ---------- input ----------
function onTap(e){
  if (e) e.preventDefault();
  if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(err){} }
  if (ac && ac.state === 'suspended') ac.resume();
  if (state === 'title'){ if (stateT > 20){ lvl = 0; got = []; resetLevel(); setState('card'); sfx.coin(); } }
  else if (state === 'card'){ if (stateT > 25){ setState('play'); flap(); } }
  else if (state === 'play'){ flap(); }
  else if (state === 'done'){
    if (stateT > 40){
      if (lvl < LEVELS.length - 1){ lvl++; resetLevel(); setState('card'); }
      else { setState('kitchen'); kPhase = 'idle'; kT = 0; parts = []; }
    }
  }
  else if (state === 'fail'){ if (stateT > 40){ resetLevel(); setState('card'); } }
  else if (state === 'kitchen'){
    if (kPhase === 'idle' && kT > 30){ kPhase = 'mix'; kT = 0; }
    else if (kPhase === 'cake' && candles >= 5 && kT > 40){ kPhase = 'blown'; kT = 0; sfx.blow();
      for (let i=0;i<5;i++) for (let k=0;k<6;k++) parts.push({ x: 140+i*18+4, y: 360, vx: rnd(-0.4,0.4), vy: rnd(-1.4,-0.6), c:'#cfcfd6', s:5, life: rnd(50,90) });
      setTimeout(()=>{ confetti(120, 150); sfx.fanfare(); }, 500);
    }
    else if (kPhase === 'blown' && kT > 150){ setState('title'); parts = []; }
  }
}
cv.addEventListener('pointerdown', onTap);
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter'){ onTap(e); } });
document.addEventListener('touchmove', e => e.preventDefault(), { passive:false });

// ---------- update ----------
function update(dt){
  t += dt; stateT += dt;
  if (shake > 0) shake -= dt;
  const L = LEVELS[lvl];

  if (state === 'title' || state === 'card'){
    updateBg(dt, 1);
    g.y = (state === 'title' ? 330 : 280) + Math.sin(t*0.06)*12;
  }
  else if (state === 'play'){
    updateBg(dt, L.speed);
    g.vy = Math.min(g.vy + 0.27*dt, 7.5);
    g.y += g.vy*dt;
    if (g.flapT > 0) g.flapT -= dt;
    if (g.inv > 0) g.inv -= dt;
    if (g.y < 24){ g.y = 24; g.vy = 0; }
    if (g.y > GROUND - 22){ g.y = GROUND - 22; g.vy = -6.5; hurt(); }

    if (!pipes.length){ if (stateT > 60) spawnPipe(); }
    else if (pipes[pipes.length-1].x < W - L.spacing) spawnPipe();

    for (const p of pipes){
      p.x -= L.speed*dt;
      if (g.inv <= 0){
        const r = 16, cx = p.x - (CAPW-PW)/2;
        if (circleRect(g.x, g.y, r, p.x, -10, PW, p.top + 10) ||
            circleRect(g.x, g.y, r, cx, p.top - CAPH, CAPW, CAPH) ||
            circleRect(g.x, g.y, r, p.x, p.bot, PW, GROUND - p.bot) ||
            circleRect(g.x, g.y, r, cx, p.bot, CAPW, CAPH)) hurt();
      }
    }
    pipes = pipes.filter(p => p.x > -80);
    for (const it of items){
      it.x -= L.speed*dt;
      if (!it.taken && (it.x-g.x)**2 + (it.y-g.y)**2 < 34*34){
        it.taken = true; collected++; sfx.coin();
        floats.push({ x: it.x, y: it.y - 20, txt: '+1', life: 50 });
        for (let i=0;i<12;i++) parts.push({ x: it.x, y: it.y, vx: rnd(-3,3), vy: rnd(-3,3), c: '#ffe36b', s: 4, life: 25 });
        if (collected >= L.need){ got.push(L.ing); setState('done'); sfx.win(); confetti(50, 120); }
      }
    }
    items = items.filter(it => it.x > -40 && !it.taken);
  }
  else if (state === 'done' || state === 'fail'){ updateBg(dt*0.3, 1); }
  else if (state === 'kitchen'){
    kT += dt;
    if (kPhase === 'mix'){
      const idx = Math.floor(kT / 22);
      if (kT % 22 < dt && idx < 5) sfx.ding(idx);
      if (kT > 22*5 + 80){ kPhase = 'poof'; kT = 0; sfx.poof();
        for (let i=0;i<40;i++){ const a = rnd(0, Math.PI*2), sp = rnd(1,4); parts.push({ x:180, y:440, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, c:'#ffffff', s: rnd(8,16)|0, life: rnd(30,50), fade:true }); }
      }
    } else if (kPhase === 'poof'){
      if (kT > 35){ kPhase = 'cake'; kT = 0; candles = 0; confetti(60, 150); }
    } else if (kPhase === 'cake'){
      const want = Math.min(5, Math.floor(Math.max(0, kT - 30) / 14));
      if (want > candles){ candles = want; sfx.ding(candles + 2); }
    }
  }

  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.grav||0.12)*dt; if (p.fade){ p.vx*=0.95; p.vy*=0.9; } p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats){ f.y -= 0.8*dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
}

// ---------- draw ----------
function drawParts(){
  for (const p of parts){
    if (p.fade){ ctx.globalAlpha = clamp(p.life/30, 0, 1); }
    const s = p.spin ? (Math.floor(p.life/6)%2 ? p.s : Math.max(2, p.s/2)) : p.s;
    rect(p.x - s/2, p.y - s/2, s, s, p.c);
    ctx.globalAlpha = 1;
  }
}
function drawHUD(){
  const L = LEVELS[lvl];
  for (let i=0;i<MAX_HEARTS;i++) img(i < hearts ? HEART : HEART_E, 12 + i*26, 14, 3);
  const ic = ING[L.ing].spr;
  rect(W-108, 8, 100, 40, 'rgba(58,34,51,.55)');
  imgC(ic, W-86, 28, 2.5);
  text(collected + '/' + L.need, W-46, 30, 13, '#fff');
  text('Уровень ' + (lvl+1), W/2, 66, 10, '#fff');
}
function blink(){ return Math.floor(t/28) % 2 === 0; }

function drawWorld(){
  drawSky();
  for (const p of pipes){ drawColumn(p.x, -20, p.top, true); drawColumn(p.x, p.bot, GROUND, false); }
  for (const it of items){
    const bob = Math.sin(t*0.08 + it.ph)*4;
    ctx.globalAlpha = 0.35; rect(it.x-18, it.y-18+bob, 36, 36, '#fff'); ctx.globalAlpha = 1;
    imgC(ING[LEVELS[lvl].ing].spr, it.x, it.y + bob, 3);
  }
  drawGround();
}

function drawKitchen(){
  // wall
  rect(0,0,W,H,'#fde6c6');
  for (let y=0;y<470;y+=30) rect(0,y,W,2,'#f5d3a6');
  for (let y=0;y<470;y+=30) for (let x=((y/30)%2)*20;x<W;x+=40) rect(x,y,2,30,'#f5d3a6');
  // bunting
  const cols = ['#ff4d6d','#ffd23f','#4f9df0','#4caf50','#ff9ec7','#b77cff'];
  rect(0, 38, W, 3, '#7a4a3a');
  for (let i=0;i<9;i++){
    const fx = 8 + i*40;
    for (let r=0;r<8;r++){ const w = 28 - r*3.5; rect(fx + (28-w)/2, 41 + r*4, w, 4, cols[i%cols.length]); }
  }
  // table
  rect(0, 470, W, 8, '#a3314a');
  for (let r=0;r<9;r++) for (let i=0;i<W/20+1;i++) rect(i*20, 478 + r*20, 20, 20, ((i+r)%2===0)?'#e8425a':'#fff4f0');
}
function drawBowl(cx, rimY, wob){
  ctx.save(); ctx.translate(cx, rimY); ctx.rotate(wob);
  const rows = 10;
  for (let i=0;i<rows;i++){
    const w = 150 - i*i*0.7 - i*2; rect(-w/2, i*5, w, 5, i < 2 ? '#a9d4ff' : (i > 7 ? '#5d97d6' : '#7fb6f0'));
  }
  rect(-78, -6, 156, 8, '#3d6ea8'); rect(-74, -4, 148, 4, '#fff1c7');
  rect(-60, 12, 10, 6, 'rgba(255,255,255,.7)');
  rect(-40, 58, 80, 6, '#3d6ea8');
  ctx.restore();
}
function drawCake(sc){
  ctx.save(); ctx.translate(180, 515); ctx.scale(sc, sc); ctx.translate(-180, -515);
  rect(64, 515, 232, 10, '#e9e9f2'); rect(64, 525, 232, 4, '#b9b9cc');
  // bottom tier
  rect(98, 453, 164, 64, '#5a2b3a'); rect(102, 457, 156, 58, '#f9bfd5');
  rect(102, 487, 156, 7, '#fff3df'); rect(102, 457, 156, 10, '#fffaf3');
  for (let i=0;i<10;i++) rect(106 + i*15, 467, 7, (i%3===0)?12:(i%2?6:9), '#fffaf3');
  rect(102, 509, 156, 6, '#e48fb1');
  // top tier
  rect(123, 403, 114, 52, '#5a2b3a'); rect(127, 407, 106, 46, '#f9bfd5');
  rect(127, 430, 106, 6, '#fff3df'); rect(127, 407, 106, 9, '#fffaf3');
  for (let i=0;i<7;i++) rect(131 + i*15, 416, 7, (i%2)?6:10, '#fffaf3');
  // strawberries on bottom tier
  [112, 238].forEach(x => imgC(ING.berry.spr, x, 448, 2));
  // candles
  const ccol = ['#4f9df0','#ffd23f','#4caf50','#ff4d6d','#b77cff'];
  for (let i=0;i<5;i++){
    const x = 140 + i*18;
    rect(x, 373, 8, 32, '#ffffff');
    for (let k=0;k<4;k++) rect(x, 375 + k*8, 8, 4, ccol[i]);
    rect(x+3, 367, 2, 6, '#3a2233');
    if (kPhase === 'cake' && i < candles){
      const fl = Math.floor((t + i*7)/5) % 2;
      ctx.globalAlpha = 0.25; rect(x-6, 348, 20, 22, '#ffe36b'); ctx.globalAlpha = 1;
      rect(x+1, 356 - fl, 6, 11 + fl, '#ff8a1f');
      rect(x+2, 352 - fl, 4, 6, '#ffd23f');
      rect(x+3, 360, 2, 5, '#fff7d0');
    }
  }
  ctx.restore();
}

function draw(){
  ctx.setTransform(R,0,0,R,0,0);
  ctx.imageSmoothingEnabled = false;
  if (shake > 0) ctx.translate(rnd(-3,3), rnd(-3,3));

  if (state === 'kitchen'){
    drawKitchen();
    const row = got.length ? got : LEVELS.map(l => l.ing);
    if (kPhase === 'idle' || kPhase === 'mix'){
      drawBowl(180, 420, kPhase === 'mix' && kT > 110 ? Math.sin(kT*0.5)*0.08 : 0);
      row.forEach((k, i) => {
        const sx = 60 + i*60, sy = 230 + Math.sin(t*0.07 + i)*5;
        let x = sx, y = sy, show = true;
        if (kPhase === 'mix'){
          const p = clamp((kT - i*22) / 22, 0, 1);
          if (p >= 1) show = false;
          x = sx + (180 - sx)*p; y = sy + (425 - sy)*p - Math.sin(p*Math.PI)*80;
        }
        if (show) imgC(ING[k].spr, x, y, 3);
      });
      if (kPhase === 'mix' && kT > 110){
        // spoon stirring
        ctx.save(); ctx.translate(180, 418); ctx.rotate(Math.sin(kT*0.25)*0.5);
        rect(-4, -80, 8, 70, '#b07a45'); rect(-9, -14, 18, 14, '#b07a45'); ctx.restore();
        if (Math.floor(kT)%6===0) parts.push({ x: rnd(130,230), y: 410, vx: rnd(-1,1), vy: rnd(-3,-1), c:'#fff1c7', s:4, life:25 });
      }
      drawGrandma(70 + Math.sin(t*0.03)*6, 330 + Math.sin(t*0.06)*8, 3, { wingDown: Math.floor(t/9)%2===0, happy: kPhase==='mix' });
      text('Все продукты', W/2, 110, 16, '#fff');
      text('собраны!', W/2, 138, 16, '#fff');
      if (kPhase === 'idle' && blink()) wrap('Нажми, чтобы испечь тортик!', W/2, 170, 320, 11, 22, '#ffd23f');
      if (kPhase === 'mix') text('Мешаем тесто...', W/2, 180, 11, '#fff');
    }
    if (kPhase === 'poof') drawBowl(180, 420, 0);
    if (kPhase === 'cake' || kPhase === 'blown'){
      const sc = kPhase === 'cake' ? Math.min(1, 0.4 + kT/20) : 1;
      drawCake(sc);
      drawGrandma(180 + Math.sin(t*0.03)*30, 290 + Math.sin(t*0.06)*8, 3, { wingDown: Math.floor(t/7)%2===0, happy: true });
      if (kPhase === 'cake'){
        text('Тортик готов!', W/2, 110, 18, '#fff');
        if (candles >= 5){
          text('Загадай желание', W/2, 160, 11, '#ffd23f');
          if (blink()) wrap('и нажми, чтобы задуть свечи', W/2, 186, 320, 9, 18, '#fff');
        }
      } else {
        text('Ура-а-а!', W/2, 104, 24, '#ffd23f');
        text('Бабуля,', W/2, 150, 16, '#fff');
        text('ты лучшая!', W/2, 178, 16, '#fff');
        // floating hearts
        for (let i=0;i<6;i++){ const hy = 250 - ((t*0.6 + i*40) % 120); ctx.globalAlpha = clamp(hy/250, 0, 1)*0.9; img(HEART, 30 + i*55, hy, 3); ctx.globalAlpha = 1; }
        if (kT > 150 && blink()) text('Нажми, чтобы сыграть ещё', W/2, 610, 9, '#fff');
      }
    }
    drawParts();
    return;
  }

  drawWorld();

  if (state === 'title'){
    text('Бабушкин', W/2, 120, 24, '#ffd23f');
    text('тортик', W/2, 158, 24, '#ffd23f');
    wrap('Помоги бабушке собрать продукты для торта', W/2, 205, 300, 10, 20, '#fff');
    drawGrandma(W/2, g.y, 4, { wingDown: Math.floor(t/9)%2===0 });
    if (blink()) text('Нажми, чтобы начать', W/2, 470, 12, '#fff');
  } else {
    const flapping = g.flapT > 0;
    const blinkInv = g.inv > 0 && Math.floor(g.inv/5)%2===0;
    if (!blinkInv) drawGrandma(g.x, g.y, 3, {
      wingDown: state === 'play' ? flapping : Math.floor(t/9)%2===0,
      angle: state === 'play' ? clamp(g.vy*0.05, -0.3, 0.45) : 0,
      happy: state === 'done' || floats.length > 0 });
  }
  drawParts();
  for (const f of floats){ ctx.globalAlpha = clamp(f.life/20,0,1); text(f.txt, f.x, f.y, 14, '#ffe36b'); ctx.globalAlpha = 1; }

  if (state === 'play') drawHUD();

  if (state === 'card'){
    const L = LEVELS[lvl], I = ING[L.ing];
    panel(30, 120, 300, 340);
    text('Уровень ' + (lvl+1), W/2, 160, 18, '#ff4d6d', 'center', '#5a3b2e');
    imgC(I.spr, W/2, 225, 6);
    text('Собери ' + I.acc, W/2, 290, 12, '#3a2233', 'center', null);
    text('× ' + L.need, W/2, 318, 16, '#3a2233', 'center', null);
    LEVELS.forEach((l, i) => { ctx.globalAlpha = got.includes(l.ing) ? 1 : 0.22; imgC(ING[l.ing].spr, 90 + i*45, 365, 2.5); ctx.globalAlpha = 1; });
    if (lvl === 0) wrap('Нажимай на экран, и бабушка взлетит!', W/2, 410, 260, 9, 18, '#7a4a5a', null);
    else wrap('Сердечек: ' + MAX_HEARTS + '. Не бойся задеть столбик!', W/2, 410, 260, 9, 18, '#7a4a5a', null);
    if (blink() && stateT > 25) text('Нажми, чтобы лететь', W/2, 500, 11, '#fff');
  }
  if (state === 'done'){
    const L = LEVELS[lvl], I = ING[L.ing];
    panel(30, 170, 300, 250);
    text('Ура!', W/2, 210, 22, '#ff4d6d', 'center', '#5a3b2e');
    imgC(I.spr, W/2, 270, 5);
    text(I.done, W/2, 335, 13, '#3a2233', 'center', null);
    if (lvl === LEVELS.length - 1) text('Все продукты!', W/2, 365, 10, '#7a4a5a', 'center', null);
    if (blink() && stateT > 40) text(lvl === LEVELS.length-1 ? 'Нажми — на кухню!' : 'Нажми — дальше', W/2, 470, 11, '#fff');
  }
  if (state === 'fail'){
    panel(30, 190, 300, 210);
    text('Ой!', W/2, 235, 22, '#ff4d6d', 'center', '#5a3b2e');
    wrap('Не беда, попробуем ещё разок!', W/2, 290, 250, 11, 24, '#3a2233', null);
    if (blink() && stateT > 40) text('Нажми, чтобы снова', W/2, 455, 11, '#fff');
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(3, (now - last) / 16.667); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
function start(){
  if (location.hash === '#cake'){ got = LEVELS.map(l => l.ing); state = 'kitchen'; kPhase = 'idle'; kT = 0; }
  last = performance.now(); requestAnimationFrame(loop);
}
let started = false;
const go = () => { if (!started){ started = true; start(); } };
if (document.fonts && document.fonts.load){
  document.fonts.load('16px "Press Start 2P"', 'Бабушка').then(go, go);
  setTimeout(go, 1500);
} else go();
})();
</script>
</body>
</html>
