<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2a1f33">
<title>Бабушкин тортик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#2a1f33;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;touch-action:none;box-shadow:0 0 60px rgba(0,0,0,.55);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
/* =====================================================================
   ПОГОНЯ ЗА ИНГРЕДИЕНТАМИ
   Бабушка бежит по деревне и собирает продукты для праздничного торта.
   Управление: нажатие / пробел — прыжок, ещё раз в воздухе — двойной.
   ===================================================================== */
const H = 640, GROUND = 520;
let W = 360, R = 2, GX = 96;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let g = ctx;                       // текущий контекст рисования (меняется при сборке спрайтов)
let cache = {}, mapCv = null;

function resize(){
  const iw = innerWidth, ih = innerHeight;
  W = Math.round(Math.max(360, Math.min(1100, H * iw / ih)));
  const s = Math.min(iw / W, ih / H);
  const dpr = window.devicePixelRatio || 1;
  R = Math.max(1, Math.min(2, s * dpr));
  cv.width = Math.round(W * R); cv.height = Math.round(H * R);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  GX = Math.max(92, Math.min(230, W * 0.27));
  cache = {}; mapCv = null;
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rnd = (a,b) => a + Math.random()*(b-a);
const rndi = n => Math.floor(Math.random()*n);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
const hash = (i,s) => { const v = Math.sin(i*127.1 + s*311.7)*43758.5453; return v - Math.floor(v); };
const TAU = Math.PI*2;

function rrp(x,y,w,h,r){ r = Math.min(r, w/2, h/2);
  g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r); g.lineTo(x+w,y+h-r);
  g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h); g.quadraticCurveTo(x,y+h,x,y+h-r);
  g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
const circ = (x,y,r,col) => { g.fillStyle = col; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill(); };
const ell = (x,y,rx,ry,col,rot=0) => { g.fillStyle = col; g.beginPath(); g.ellipse(x,y,rx,ry,rot,0,TAU); g.fill(); };
const box = (x,y,w,h,r,col) => { g.fillStyle = col; g.beginPath(); rrp(x,y,w,h,r); g.fill(); };
const poly = (p,col) => { g.fillStyle = col; g.beginPath(); g.moveTo(p[0],p[1]);
  for (let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); g.fill(); };
const line = (x1,y1,x2,y2,col,w=2) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); };
const shape = (fn,col,stroke,sw=2) => { g.beginPath(); fn(g);
  if (col){ g.fillStyle = col; g.fill(); }
  if (stroke){ g.strokeStyle = stroke; g.lineWidth = sw; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); } };
const arc = (x,y,r,a0,a1,col,w=2) => { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.arc(x,y,r,a0,a1); g.stroke(); };

const UI = '"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif';
const LOGO = '"Pacifico","Nunito","Trebuchet MS",cursive';
function text(str, x, y, size, color='#fff', o={}){
  g.font = (o.weight||900) + ' ' + size + 'px ' + (o.font||UI);
  g.textAlign = o.align||'center'; g.textBaseline = 'middle';
  if (o.stroke){ g.lineWidth = o.sw||Math.max(3,size*0.3); g.strokeStyle = o.stroke; g.lineJoin = 'round'; g.strokeText(str,x,y); }
  g.fillStyle = color; g.fillText(str,x,y);
}
function wrap(str, x, y, maxW, size, lh, color, o={}){
  g.font = (o.weight||900) + ' ' + size + 'px ' + (o.font||UI);
  const words = str.split(' '); let ln = '', lines = [];
  for (const w of words){ const t = ln ? ln+' '+w : w;
    if (g.measureText(t).width > maxW && ln){ lines.push(ln); ln = w; } else ln = t; }
  lines.push(ln);
  lines.forEach((l,i) => text(l, x, y + i*lh, size, color, o));
  return lines.length;
}
function panel(x,y,w,h){
  g.save();
  box(x+3,y+7,w,h,22,'rgba(40,20,40,.28)');
  box(x,y,w,h,22,'#7a4a3a'); box(x+3,y+3,w-6,h-6,19,'#ffe9c9'); box(x+7,y+7,w-14,h-14,15,'#fffaf0');
  g.setLineDash([5,5]); g.strokeStyle = 'rgba(214,150,110,.55)'; g.lineWidth = 1.5;
  g.beginPath(); rrp(x+12,y+12,w-24,h-24,11); g.stroke(); g.setLineDash([]);
  g.restore();
}
function heart(x,y,s,col,hi){
  shape(c => { c.moveTo(x,y+s*.9); c.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.8,y-s*1.15,x,y-s*.35);
    c.bezierCurveTo(x+s*.8,y-s*1.15,x+s*1.5,y-s*.1,x,y+s*.9); }, col);
  if (hi) ell(x-s*.42,y-s*.38,s*.2,s*.13,hi,-.6);
}

// ---------- sprite system ----------
const SPR = {};
function def(key,w,h,fn,ax,ay){ SPR[key] = { w, h, fn, ax: ax===undefined ? w/2 : ax, ay: ay===undefined ? h : ay }; }
function put(key,x,y,sc=1,flip=false){
  const s = SPR[key]; let cn = cache[key];
  if (!cn){
    cn = document.createElement('canvas'); cn.width = Math.ceil(s.w*R); cn.height = Math.ceil(s.h*R);
    const old = g; g = cn.getContext('2d'); g.scale(R,R); g.translate(s.ax,s.ay); s.fn(); g = old; cache[key] = cn;
  }
  if (flip){ g.save(); g.translate(x,y); g.scale(-1,1); g.drawImage(cn, -s.ax*sc, -s.ay*sc, s.w*sc, s.h*sc); g.restore(); }
  else g.drawImage(cn, x - s.ax*sc, y - s.ay*sc, s.w*sc, s.h*sc);
}
function live(key,x,y,sc=1){ g.save(); g.translate(x,y); g.scale(sc,sc); SPR[key].fn(); g.restore(); }

// =====================================================================
//  ИНГРЕДИЕНТЫ (центр в 0,0)
// =====================================================================
def('milk',44,48,() => {
  box(-11.5,-9.5,23,29,7,'#3d5a80'); box(-7.5,-19,15,13,4,'#3d5a80'); box(-8.5,-23,17,8,3,'#2c5aa0');
  box(-10,-8,20,26,6,'#ffffff'); box(-6,-17.5,12,12,3,'#ffffff'); box(-7,-21.5,14,5,2,'#4f9df0');
  box(-10,0,20,11,0,'#6db3f5'); circ(-3,5.5,2.6,'#fff'); circ(2.5,4,1.8,'#fff'); circ(4,7.5,1.5,'#fff');
  box(4.5,-7,4,24,2,'rgba(90,130,180,.22)'); box(-7.5,-6,2.5,10,1.2,'rgba(255,255,255,.9)');
},22,24);
def('egg',44,48,() => {
  ell(0,1,13,16,'#8a6a4a'); ell(0,1,11.5,14.5,'#fff1d6');
  shape(c => { c.ellipse(0,1,11.5,14.5,0,0.2,Math.PI-0.9); c.quadraticCurveTo(2,10,10.8,4); }, '#f0d6aa');
  ell(-4,-5,3,5.5,'#ffffff',-.45); circ(4,7,1,'#e2c08c'); circ(-2,9.5,.8,'#e2c08c'); circ(6,1,.8,'#e2c08c');
},22,24);
def('flour',44,48,() => {
  box(-13.5,-10.5,27,29,9,'#7a5632'); poly([-9,-10,-12,-19,-3,-14,3,-14,12,-19,9,-10],'#7a5632');
  box(-12,-9,24,26,8,'#f0dcb4'); poly([-7.5,-9,-9.5,-16.5,-2,-12.5,2,-12.5,9.5,-16.5,7.5,-9],'#f0dcb4');
  box(-8,-12,16,3.4,1.5,'#c9743a'); box(4,-8,7,24,4,'rgba(170,130,80,.25)');
  circ(0,5,7.5,'#fffaf0'); line(0,10,0,1,'#d99a2b',1.4);
  for (let i=0;i<3;i++){ ell(-2.3,7.5-i*3,1.3,2.2,'#e8b23a',.6); ell(2.3,7.5-i*3,1.3,2.2,'#e8b23a',-.6); }
  ell(0,-.5,1.3,2.3,'#e8b23a');
},22,24);
def('sugar',44,48,() => {
  const cube = (x,y,s) => {
    poly([x-s-1.5,y-s*.5-1.5, x,y-s-2, x+s+1.5,y-s*.5-1.5, x+s+1.5,y+s*.6+1.5, x,y+s*1.1+2, x-s-1.5,y+s*.6+1.5],'#5d6f8f');
    poly([x-s,y-s*.5, x,y-s, x+s,y-s*.5, x,y],'#ffffff');
    poly([x-s,y-s*.5, x,y, x,y+s*1.1, x-s,y+s*.6],'#e6eefb');
    poly([x+s,y-s*.5, x,y, x,y+s*1.1, x+s,y+s*.6],'#c4d2ea');
    circ(x-s*.35,y-s*.48,.9,'#dfe9f8'); circ(x+s*.3,y-s*.55,.7,'#dfe9f8');
  };
  cube(-8,8,8); cube(8,8,8); cube(0,-6,8);
  const sp = (x,y,s) => poly([x,y-s, x+s*.3,y-s*.3, x+s,y, x+s*.3,y+s*.3, x,y+s, x-s*.3,y+s*.3, x-s,y, x-s*.3,y-s*.3],'#fff7b0');
  sp(13,-12,4); sp(-14,-5,2.6);
},22,24);
def('berry',44,48,() => {
  const body = (s) => c => { c.moveTo(0,17*s); c.bezierCurveTo(-19*s,3*s,-16*s,-13*s,0,-9*s); c.bezierCurveTo(16*s,-13*s,19*s,3*s,0,17*s); };
  g.save(); g.translate(0,1); shape(body(1.12),'#7a1f2a'); g.restore();
  shape(body(1),'#ec3b4f');
  shape(c => { c.moveTo(0,17); c.bezierCurveTo(8,10,14,2,12,-7); c.bezierCurveTo(15,-2,13,8,0,17); },'#c92a40');
  ell(-6,-3,2.6,4.6,'rgba(255,255,255,.55)',.5);
  [[-7,3],[0,-2],[6,2],[-3,8],[4,9],[0,13],[9,-4],[-9,-5]].forEach(p => ell(p[0],p[1],1,1.6,'#ffe9a8'));
  for (let i=0;i<5;i++){ const a = -Math.PI/2 + (i-2)*.62;
    shape(c => { c.moveTo(0,-9); c.quadraticCurveTo(Math.cos(a-.3)*8,-9+Math.sin(a-.3)*8+2,Math.cos(a)*11,-8+Math.sin(a)*5);
      c.quadraticCurveTo(Math.cos(a+.3)*6,-9+Math.sin(a+.3)*6+3,0,-9); },'#3f9d4a','#2c7a3a',1); }
  line(0,-11,2,-17,'#2c7a3a',2.2);
},22,24);

const ING = {
  milk:  { name:'Молоко',   acc:'молоко',   done:'Молоко есть!',   glow:'#bfe0ff' },
  egg:   { name:'Яйца',     acc:'яйца',     done:'Яйца есть!',     glow:'#fff0c8' },
  flour: { name:'Мука',     acc:'муку',     done:'Мука есть!',     glow:'#ffe7b0' },
  sugar: { name:'Сахар',    acc:'сахар',    done:'Сахар есть!',    glow:'#e6f0ff' },
  berry: { name:'Клубника', acc:'клубнику', done:'Клубника есть!', glow:'#ffc2cc' },
};

// =====================================================================
//  ПРЕПЯТСТВИЯ (начало координат — низ по центру)
// =====================================================================
const OBS = {};
function obs(key,w,h,fn){ OBS[key] = { w, h }; def(key, w+24, h+22, fn); }
const shadow = (w) => ell(0,1,w*.55,4,'rgba(30,40,20,.22)');

obs('bidon',28,42,() => { shadow(28);
  shape(c => { c.moveTo(-14,-2); c.lineTo(-14,-27); c.quadraticCurveTo(-13,-34,-8,-36); c.lineTo(-8,-42); c.lineTo(8,-42); c.lineTo(8,-36);
    c.quadraticCurveTo(13,-34,14,-27); c.lineTo(14,-2); c.quadraticCurveTo(0,2,-14,-2); },'#b9c4d0','#56616f',2);
  box(-9.5,-45,19,5,2,'#8f9aa8'); g.strokeStyle='#56616f'; g.lineWidth=1.5; g.beginPath(); rrp(-9.5,-45,19,5,2); g.stroke();
  box(-10,-27,4,22,2,'rgba(255,255,255,.65)'); box(6,-28,6,25,3,'rgba(70,85,105,.22)');
  line(-13,-20,13,-20,'#8f9aa8',1.5); line(-13,-9,13,-9,'#8f9aa8',1.5);
  arc(-15,-27,5,1.2,5,'#56616f',2); arc(15,-27,5,-1.9,1.9,'#56616f',2);
});
obs('hay',48,34,() => { shadow(48);
  box(-24,-35,48,35,9,'#8a5c1f'); box(-22.5,-33.5,45,32,8,'#ecbd4f');
  box(-22.5,-33.5,45,9,6,'#f7d572');
  for (let i=0;i<18;i++){ const x=-20+hash(i,1)*40, y=-30+hash(i,2)*26; line(x,y,x+4+hash(i,3)*6,y+hash(i,4)*2-1,'#c9952f',1.2); }
  box(-12,-34,3.5,33,1,'#a8672e'); box(9,-34,3.5,33,1,'#a8672e');
  line(-24,-22,-29,-25,'#ecbd4f',1.5); line(23,-10,29,-12,'#ecbd4f',1.5); line(-6,-35,-9,-40,'#ecbd4f',1.5); line(14,-35,17,-39,'#ecbd4f',1.5);
});
obs('bucket',30,28,() => { shadow(30);
  arc(0,-25,15,Math.PI,TAU,'#56616f',2);
  shape(c => { c.moveTo(-11,0); c.lineTo(11,0); c.lineTo(15,-26); c.lineTo(-15,-26); c.closePath(); },'#7fa3c7','#3f5d7d',2);
  poly([5,-1,11,-1,14,-25,9,-25],'rgba(40,70,110,.25)'); box(-10,-22,3,18,1.5,'rgba(255,255,255,.55)');
  ell(0,-26,15,4.5,'#3f5d7d'); ell(0,-26,13,3.3,'#fafdff');
  line(-13,-14,13,-14,'#5d83aa',1.5);
});
obs('hen',34,32,() => { shadow(30);
  line(-3,-6,-4,0,'#e8952e',2); line(4,-6,5,0,'#e8952e',2); line(-7,0,-1,0,'#e8952e',2); line(2,0,8,0,'#e8952e',2);
  shape(c => { c.moveTo(-12,-18); c.quadraticCurveTo(-24,-32,-17,-34); c.quadraticCurveTo(-14,-30,-12,-28); c.quadraticCurveTo(-13,-35,-8,-34); c.quadraticCurveTo(-6,-27,-4,-22); },'#f3e3cf','#8a6a4a',1.6);
  shape(c => { c.ellipse(0,-15,15,11.5,0,0,TAU); },'#fff8ee','#8a6a4a',1.8);
  shape(c => { c.arc(11,-27,7.5,0,TAU); },'#fff8ee','#8a6a4a',1.8);
  ell(4,-20,9,7,'#fff8ee');
  shape(c => { c.moveTo(6,-33); c.quadraticCurveTo(7,-39,10,-35); c.quadraticCurveTo(12,-40,14,-35); c.quadraticCurveTo(17,-38,16,-32); c.closePath(); },'#e23d4f');
  poly([17.5,-28,24,-26,17.5,-23.5],'#f2a21e'); ell(16,-21.5,2,3.2,'#e23d4f');
  circ(13,-28.5,1.6,'#2b1d1a'); circ(13.5,-29,.5,'#fff');
  shape(c => { c.moveTo(-9,-17); c.quadraticCurveTo(-2,-24,6,-16); c.quadraticCurveTo(-1,-8,-9,-17); },'#f1dcc0','#b99a78',1.2);
});
obs('can',40,30,() => { shadow(40);
  shape(c => { c.moveTo(10,-22); c.lineTo(24,-32); },null,'#2f7a4a',5.5); shape(c => { c.moveTo(10,-22); c.lineTo(24,-32); },null,'#4fae6a',3);
  ell(25,-33,3.2,5,'#2f7a4a',.9); ell(25.5,-33.5,2,3.6,'#7fd096',.9);
  arc(-13,-17,9,1.2,5.1,'#2f7a4a',3.2);
  shape(c => { c.moveTo(-12,0); c.lineTo(-13,-28); c.lineTo(13,-28); c.lineTo(12,0); c.closePath(); },'#4fae6a','#2f7a4a',2);
  poly([5,-27,12,-27,11,-1,6,-1],'rgba(20,80,40,.25)'); box(-9,-24,3,19,1.5,'rgba(255,255,255,.5)');
  ell(0,-28,13,3.5,'#2f7a4a'); ell(0,-28,11,2.4,'#8fd3ff');
  line(-12,-10,12,-10,'#3c9158',1.5); circ(0,-17,4,'#fff'); for (let i=0;i<5;i++) circ(Math.cos(i/5*TAU)*4,-17+Math.sin(i/5*TAU)*4,2,'#ff9ec7'); circ(0,-17,1.8,'#f2c94c');
});
obs('pumpkin',40,30,() => { shadow(40);
  ell(0,-14,20.5,15.5,'#8a4a12'); ell(-10,-14,10,13.5,'#f08a24'); ell(10,-14,10,13.5,'#e87c1a'); ell(0,-14,10,14.5,'#f79a35');
  ell(-4,-19,2.5,6,'rgba(255,255,255,.3)',.3);
  shape(c => { c.moveTo(-2,-27); c.quadraticCurveTo(-1,-34,5,-35); c.lineTo(6,-32); c.quadraticCurveTo(3,-31,3,-27); c.closePath(); },'#5f8a3a','#3f6426',1.2);
  shape(c => { c.moveTo(3,-29); c.quadraticCurveTo(12,-36,15,-28); },null,'#5f8a3a',1.5);
});
obs('stone',38,38,() => { shadow(40);
  shape(c => c.arc(0,-19,19,0,TAU),'#aab0b8','#5a616c',2);
  shape(c => { c.arc(0,-19,19,-.9,1.3); c.arc(-3,-19,17.5,1.2,-.8,true); c.closePath(); },'rgba(60,70,85,.28)');
  for (let i=0;i<8;i++){ const a = i/8*TAU; line(Math.cos(a)*7,-19+Math.sin(a)*7,Math.cos(a+.25)*16,-19+Math.sin(a+.25)*16,'#8a919c',1.6); }
  shape(c => c.rect(-4.5,-23.5,9,9),'#5c3a26','#3a2a26',1.4);
  ell(-8,-30,5,2.2,'rgba(255,255,255,.4)',-.6); circ(-10,-2,2.5,'#fffdf5'); circ(9,-1,2,'#fffdf5'); circ(14,-3,1.4,'#fffdf5');
});
obs('sheaf',30,48,() => { shadow(30);
  for (let i=-4;i<=4;i++){ const tx=i*4.4, bx=i*2.6;
    line(bx,0,i*1.2,-22,'#c9952f',2.4); line(i*1.2,-22,tx,-40,'#d9a63f',2);
    for (let k=0;k<3;k++){ ell(tx-1.6+i*.3*k,-40-k*3.2,1.6,3,'#f2c94c',.5+i*.08); ell(tx+1.6+i*.3*k,-40-k*3.2,1.6,3,'#e8b23a',-.5+i*.08); }
  }
  box(-8,-25,16,5.5,2.5,'#a8672e'); line(7,-22,12,-16,'#a8672e',2);
});
obs('barrow',54,30,() => { shadow(54);
  line(8,-12,30,-22,'#8a5a3c',3.5); line(-10,-6,10,-2,'#5c3a26',3); line(12,-12,16,0,'#5c3a26',3);
  shape(c => { c.moveTo(-24,-26); c.lineTo(16,-26); c.lineTo(10,-9); c.lineTo(-16,-9); c.closePath(); },'#c9573f','#6f2a22',2);
  poly([-22,-24,14,-24,13,-20,-20,-20],'#de7359');
  ell(-4,-27,16,5,'#f0dcb4'); ell(-8,-29,7,4,'#fffaf0');
  circ(-18,-7,7.5,'#3a2a26'); circ(-18,-7,4.5,'#8a8f98'); circ(-18,-7,1.6,'#3a2a26');
});
obs('crate',38,34,() => { shadow(38);

    gn.gain.setValueAtTime(vol,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn); gn.connect(ac.destination); o.start(t); o.stop(t+dur+.03); } catch(e){}
}

function onTap(e){
  if (e) e.preventDefault();
  if (!ac){ try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(err){} }
  if (ac && ac.state === 'suspended') ac.resume().catch(()=>{});
  if (trans > 0) return;
  if (state === 'title'){ if (stateT > 20){ sfx.coin(); fadeTo(() => { lvl = 0; got = []; resetLevel(); goMap(0,1); }); } }
  else if (state === 'map'){ if (stateT > 70){ sfx.step(); fadeTo(() => { resetLevel(); setState('play'); }); } }
  else if (state === 'play'){ jump(); }
  else if (state === 'done'){ if (stateT > 45){ sfx.step(); fadeTo(() => {
      if (lvl < LEVELS.length-1){ lvl++; goMap(lvl, lvl+1); }
      else { setState('kitchen'); kPhase = 'idle'; kT = 0; parts = []; kReset(); } }); } }
  else if (state === 'fail'){ if (stateT > 40){ sfx.step(); fadeTo(() => goMap(lvl+1, lvl+1)); } }
  else if (state === 'kitchen'){
    if (kPhase === 'idle' && kT > 30){ kPhase = 'add'; kT = 0; kReset(); sfx.coin(); }
    else if (kPhase === 'cake' && candles >= 5 && kT > 40){ kPhase = 'blown'; kT = 0; sfx.blow();
      const cx = W/2+44;
      for (let i=0;i<5;i++) for (let k=0;k<6;k++) parts.push({ x: cx-28+i*14, y: 276, vx: rnd(-.4,.4), vy: rnd(-1.4,-.6), c:'rgba(200,200,214,.8)', s: 5, life: rnd(50,90), fade:true, round:true, grav:-.005 });
      setTimeout(() => { if (state === 'kitchen' && kPhase === 'blown'){ confetti(140,150); sfx.fanfare(); } }, 500); }
    else if (kPhase === 'blown' && kT > 150){ fadeTo(() => { setState('title'); parts = []; }); }
  }
}

function update(dt){

  if (hudPop > 0) hudPop -= dt;
  for (const f of flies){ f.t += dt/24; if (f.t >= 1) hudPop = 10; } flies = flies.filter(f => f.t < 1);
  const L = LEVELS[lvl];
  hudBar += ((collected - flies.length)/L.need - hudBar)*Math.min(1,.15*dt);
  for (const c of clouds) c.x += c.v*dt;

  if (state === 'title'){ runSpeed = 1.4; camX += runSpeed*dt; P.ph += dt*.2; P.y = GROUND; }
  else if (state === 'map'){ runSpeed = 0; }
  else if (state === 'play'){

    if (P.inv > 0) P.inv -= dt;
    if (P.land > 0) P.land -= dt;
    const px = camX + GX;
    // платформы и земля
    let floor = GROUND;
    for (const p of plats){ if (px > p.x-8 && px < p.x+p.w+8 && prevY <= p.top+1) floor = Math.min(floor, p.top); }
    if (!P.ground && P.vy >= 0 && P.y >= floor){ P.y = floor; P.vy = 0; P.ground = true; P.jumps = 0; P.land = 8; sfx.land(); dust(GX, P.y, 5); }
    else if (P.ground && P.y < floor - .5){ P.ground = false; P.jumps = 1; }
    else if (P.ground) P.y = floor;

    while (nextX < camX + W + 140) spawnSeg();

    for (const o of obstacles){
      if (P.inv <= 0 && Math.abs(o.x - px) < o.w/2 + 6 && P.y > GROUND - o.h + 7) hurt();
    }
    for (const it of items){
      if (!it.taken && Math.abs(it.x - px) < 27 && it.y > P.y-100 && it.y < P.y+12){
        it.taken = true; collected++; sfx.coin(); P.happy = 40; flies.push({ x: it.x-camX, y: it.y, t: 0 });
        floats.push({ x: it.x - camX, y: it.y-22, txt:'+1', life: 50 });
        for (let i=0;i<14;i++){ const a = rnd(0,TAU), sp = rnd(1,3.6); parts.push({ x: it.x-camX, y: it.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, c: i%2?'#fff3a8':'#ffffff', s: rnd(3,5), life: 26, star:true, grav:.02 }); }
        if (collected >= L.need){ got.push(L.ing); setState('done'); sfx.win(); confetti(60,140); }
      }
    }
    obstacles = obstacles.filter(o => o.x > camX-80);
    items = items.filter(it => it.x > camX-50 && !it.taken);
    plats = plats.filter(p => p.x+p.w > camX-60);
    if (P.happy > 0) P.happy -= dt;
  }
  else if (state === 'done'){
    runSpeed = Math.max(0, runSpeed - .06*dt); camX += runSpeed*dt;
    if (!P.ground){ P.vy += .44*dt; P.y += P.vy*dt; if (P.y >= GROUND){ P.y = GROUND; P.ground = true; } }
    P.ph += dt*.1*runSpeed;
  }
  else if (state === 'fail'){ runSpeed = Math.max(0, runSpeed - .1*dt); camX += runSpeed*dt;
    if (!P.ground){ P.vy += .44*dt; P.y += P.vy*dt; if (P.y >= GROUND){ P.y = GROUND; P.ground = true; } } }
  else if (state === 'kitchen'){ updateKitchen(dt); }

  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.grav === undefined ? .12 : p.grav)*dt; if (p.fade){ p.vx *= .95; p.vy *= .93; } p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats){ f.y -= .8*dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);
}

  if (kPhase === 'idle'){ text('Все продукты', cx, 96, 26, '#fff', { stroke:'#7a1f34', sw:6 }); text('собраны!', cx, 128, 26, '#ffe36b', { stroke:'#7a1f34', sw:6 }); if (kT > 30) prompt('Нажми, чтобы испечь тортик!', 176); }
  if (kPhase === 'add'){ const i = Math.min(4,Math.floor(kT/KADD)), lt = kT-i*KADD, k = pop(lt/12);
    text('Готовим тесто', cx, 96, 18, '#fff', { stroke:'#7a1f34', sw:5 });
    g.save(); g.translate(cx,136); g.scale(k,k); text(ADDTXT[row[i]], 0, 0, 27, '#ffe36b', { stroke:'#7a1f34', sw:6.5 }); g.restore(); }
  if (kPhase === 'mix'){ const dots = '.'.repeat(1+Math.floor(kT/18)%3);
    text(K.m < .55 ? 'Мешаем тесто' + dots : K.m < .92 ? 'Ещё чуть-чуть' + dots : 'Готово!', cx, 112, 28, '#ffe36b', { stroke:'#7a1f34', sw:6.5 });
    const bw = 210; box(cx-bw/2-3,147,bw+6,16,8,'#7a1f34'); box(cx-bw/2,150,bw,10,5,'#ffe9c9');
    const gr = g.createLinearGradient(cx-bw/2,0,cx+bw/2,0); gr.addColorStop(0,'#ffd23f'); gr.addColorStop(1,'#ff6f8e'); g.fillStyle = gr; g.beginPath(); rrp(cx-bw/2,150,Math.max(10,bw*K.m),10,5); g.fill();
    box(cx-bw/2+3,151.4,Math.max(4,bw*K.m-6),2.6,1.3,'rgba(255,255,255,.55)'); }
  if (kPhase === 'poof') text('Тесто готово!', cx, 112, 28, '#ffe36b', { stroke:'#7a1f34', sw:6.5 });
  if (kPhase === 'cake' || kPhase === 'blown'){
    drawCake(bx, kPhase === 'cake' ? kT : 999);
    if (kPhase === 'cake'){ text('Тортик готов!', cx, 100, 30, '#ffe36b', { stroke:'#7a1f34', sw:6.5 });
      if (candles >= 5){ text('Загадай желание', cx, 146, 18, '#fff', { stroke:'#7a1f34', sw:5 }); prompt('и нажми, чтобы задуть свечи', 190); } }
    else { text('С днём рождения,', cx, 92, 28, '#ffe36b', { font: LOGO, weight:400, stroke:'#7a1f34', sw:6 });
      text('бабуля!', cx, 134, 38, '#fff', { font: LOGO, weight:400, stroke:'#e2475f', sw:7 });
      text('Ты самая лучшая!', cx, 180, 18, '#fff', { stroke:'#7a1f34', sw:5 });
      text('Бабушка Валя', cx, 208, 24, '#ffe36b', { font: LOGO, weight:400, stroke:'#7a1f34', sw:5 });
      for (let i=0;i<7;i++){ const p = ((t*.5 + i*37) % 150)/150, hx = cx-150+i*50+Math.sin(t*.04+i)*8, hy = 300-p*150; g.globalAlpha = Math.sin(p*Math.PI)*.9; heart(hx,hy,7+i%3*2,'#ff4d6d','rgba(255,255,255,.7)'); } g.globalAlpha = 1;
      if (kT > 150) prompt('Нажми, чтобы сыграть ещё', 616); }
  }
  drawParts();
  const kv = g.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.45,Math.max(W,H)*.78); kv.addColorStop(0,'rgba(60,20,30,0)'); kv.addColorStop(1,'rgba(60,20,30,.3)'); g.fillStyle = kv; g.fillRect(0,0,W,H);
}

// =====================================================================
//  DRAW
// =====================================================================
function drawTitle(){
  const cx = W/2;
  g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(0,0,W,H);
  const bobY = Math.sin(t*.05)*4;
  g.save(); g.translate(cx,150+bobY);
  g.save(); g.rotate(-.05);
  text('Бабушкин', 0, 0, 56, '#7a1f34', { font: LOGO, weight:400, stroke:'#7a1f34', sw:16 });
  text('Бабушкин', 0, -4, 56, '#fff', { font: LOGO, weight:400, stroke:'#e2475f', sw:9 });
  g.restore();
  box(-146,42,292,44,22,'#7a1f34'); box(-146,38,292,44,22,'#ffd23f'); box(-140,42,280,12,8,'rgba(255,255,255,.35)');
  text('тортик', 0, 60, 25, '#7a1f34', { font: LOGO, weight:400 });
  // иконки по дуге
  LEVELS.forEach((l,i) => { const a = -Math.PI/2 + (i-2)*.42, r = 132; put(l.ing, Math.cos(a)*r*1.02, -4+Math.sin(a)*r*.62 + Math.sin(t*.07+i)*3, .8); });
  g.restore();
  wrap('Помоги бабушке собрать продукты для праздничного торта!', cx, 268+bobY, 300, 16, 21, '#fff', { stroke:'rgba(58,30,50,.85)', sw:5 });
  if (stateT > 20) prompt('Нажми, чтобы начать', 590);
}
function draw(){
  ctx.setTransform(R,0,0,R,0,0); g = ctx;
  if (shake > 0) g.translate(rnd(-3,3), rnd(-3,3));
  if (state === 'kitchen'){ drawKitchenScene(); drawTrans(); return; }
  const L = LEVELS[lvl];
  drawWorld(L);

  if (state === 'title'){ ell(W/2,GROUND+4,26,6,'rgba(30,40,20,.28)'); granny(W/2, GROUND+2, { s:1.45, ph:P.ph }); drawFG(L); postFX(L); drawParts(); drawTitle(); drawTrans(); return; }
  if (state === 'map'){ drawFG(L); postFX(L); drawMap(); drawTrans(); return; }

  // бабушка
  const sh = clamp(1-(GROUND-P.y)/180,.35,1); ell(GX,GROUND+4,17*sh,4.5*sh,'rgba(30,40,20,.3)');
  const blinkInv = P.inv > 0 && Math.floor(P.inv/5)%2 === 0 && state === 'play';
  if (!blinkInv) granny(GX, P.y+2, { s:1, happy: P.happy > 0, ph:P.ph, air:!P.ground, vy:P.vy, land:P.land>0?P.land:0, pose: state === 'done' ? 'idle' : state === 'fail' ? 'idle' : 'run' });
  drawFG(L); drawParts(); postFX(L);
  for (const f of floats){ g.globalAlpha = clamp(f.life/20,0,1); text(f.txt, f.x, f.y, 20, '#ffe36b', { stroke:'#7a4a1a', sw:4.5 }); g.globalAlpha = 1; }
  if (state === 'play') drawHUD();

  if (state === 'done'){
    const I = ING[L.ing], k = ease(clamp(stateT/16,0,1)), cx = W/2;
    g.fillStyle = 'rgba(40,24,50,' + .3*k + ')'; g.fillRect(0,0,W,H);
    g.save(); g.translate(cx,300); g.scale(.7+.3*k,.7+.3*k); g.translate(-cx,-300); g.globalAlpha = k;
    panel(cx-150,170,300,250);
    g.save(); g.translate(cx,268); g.rotate(t*.01); g.globalAlpha = .5*k; for (let i=0;i<12;i++){ g.rotate(TAU/12); poly([-7,-34,0,-66,7,-34],'#ffe9a8'); } g.restore(); g.globalAlpha = k;
    circ(cx,268,38,'#fff3d0'); live(L.ing, cx, 268, 2);
    text('Ура!', cx, 204, 30, '#e2475f', { font: LOGO, weight:400 });
    text(I.done, cx, 336, 21, '#4a2f3a');
    LEVELS.forEach((l,i) => { const x = cx-88+i*44; circ(x,378,17, got.includes(l.ing) ? '#ffeccd' : '#f0ebe3'); g.globalAlpha = got.includes(l.ing) ? k : .25*k; put(l.ing, x, 378, .62); g.globalAlpha = k; });
    g.restore(); g.globalAlpha = 1;
    if (stateT > 45) prompt(lvl === LEVELS.length-1 ? 'Нажми — скорее на кухню!' : 'Нажми — идём дальше', 600);
  }
  if (state === 'fail'){
    const cx = W/2; g.fillStyle = 'rgba(40,24,50,.35)'; g.fillRect(0,0,W,H);
    panel(cx-150,200,300,190);
    text('Ой!', cx, 244, 32, '#e2475f', { font: LOGO, weight:400 });
    wrap('Не беда, отдохнём и попробуем ещё разок!', cx, 296, 240, 17, 24, '#4a2f3a');
    for (let i=0;i<3;i++) heart(cx-26+i*26, 356, 8, '#ff4d6d', 'rgba(255,255,255,.7)');
    if (stateT > 40) prompt('Нажми, чтобы попробовать снова', 600);
  }
  drawTrans();
}

function drawTrans(){
  grain();
  if (trans <= 0) return;
  const k = trans < 13 ? 1-trans/13 : (trans-13)/15, rad = Math.max(0, ease(clamp(k,0,1))*Math.hypot(W,H)*.62);
  g.fillStyle = '#2a1f33'; g.beginPath(); g.rect(-10,-10,W+20,H+20); g.arc(W/2,H*.52,rad,0,TAU,true); g.fill('evenodd');
  if (rad > 2){ g.strokeStyle = 'rgba(255,210,63,.9)'; g.lineWidth = 4; g.beginPath(); g.arc(W/2,H*.52,rad,0,TAU); g.stroke(); }
}
// ---------- loop ----------
let last = performance.now();
function loop(now){
  const dt = clamp((now-last)/16.667, 0, 3); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
function start(){
  const h = location.hash;
  if (h === '#cake'){ got = LEVELS.map(l => l.ing); state = 'kitchen'; kPhase = 'idle'; kT = 0; kReset(); }
  const m = h.match(/^#(lvl|map)=(\d)$/);
  if (m){ lvl = clamp(+m[2]-1,0,4); got = LEVELS.slice(0,lvl).map(l => l.ing); resetLevel(); if (m[1] === 'map') goMap(lvl,lvl+1); else setState('play'); }
  window.__game = { get state(){ return state; }, tap: () => onTap(), step: (n) => { for (let i=0;i<n;i++) update(1); draw(); }, set: (o) => { if (o.collected !== undefined) collected = o.collected; if (o.kPhase){ kPhase = o.kPhase; kT = o.kT||0; candles = o.candles||0; if (o.K) Object.assign(K,o.K); } if (o.stateT !== undefined) stateT = o.stateT; } };
  last = performance.now(); requestAnimationFrame(loop);
}
let started = false;
const go = () => { if (!started){ started = true; start(); } };
if (document.fonts && document.fonts.load){
  Promise.all([document.fonts.load('900 16px "Nunito"','Бабушка'), document.fonts.load('16px "Pacifico"','Бабушкин')]).then(go, go);
  setTimeout(go, 1500);
} else go();
})();
</script>
